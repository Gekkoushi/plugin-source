name: Build & Publish

on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - 'src/main/kotlin/tsuki/**'

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository 🌏
                uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6.0.2
                with:
                    fetch-depth: 0

            -   name: Fetch latest commit 🔖
                id: meta
                run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

            -   name: Set up Java environment 🔧
                uses: actions/setup-java@b622de1dfa918ecc0ab28f40cd42e3c3752cd6c5 # v5.2.0
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Gradle environment 📦
                uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
                with:
                    gradle-version: '9.1.0'

            -   name: Setup Android SDK 🚀
                uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

            -   name: Run build task 🚀
                run: ./gradlew buildJar --rerun-tasks

            -   name: Upload artifacts 🌐
                uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
                with:
                    repository: Gekkoushi/plugin
                    tag_name: ${{ steps.meta.outputs.sha_short }}
                    name: ${{ steps.meta.outputs.sha_short }}
                    body: |
                        Built from commit [`${{ steps.meta.outputs.sha_short }}`](https://github.com/Gekkoushi/plugin-source/commit/${{ github.sha }})
                    files: build/libs/gekkoushi.jar
                    token: ${{ secrets.ARTIFACT_REPO_TOKEN }}
